- name: type:defect
  color: "d73a4a"
  description: Bug, regression, or incorrect behavior.
- name: type:conformance
  color: "5319e7"
  description: Specification, fixture, transcript, or parity coverage.
- name: type:architecture
  color: "1d76db"
  description: Crate boundary, API, or design decision.
- name: type:docs
  color: "0075ca"
  description: Documentation-only or documentation-heavy work.
- name: type:maintenance
  color: "fbca04"
  description: CI, harness, labels, release, cleanup, or repository hygiene.
- name: type:security
  color: "b60205"
  description: Crypto, storage, privacy, dependency, or redaction-sensitive work.
