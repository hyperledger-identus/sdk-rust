[package]
name    = "identus-did-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
identus-did   = { path = "../crates/did" }
libfuzzer-sys = "=0.4.13"
serde         = "=1.0.228"
serde_json    = "=1.0.150"

[[bin]]
name  = "did"
path  = "fuzz_targets/did.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "did_url"
path  = "fuzz_targets/did_url.rs"
test  = false
doc   = false
bench = false

[workspace]
