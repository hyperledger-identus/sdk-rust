[package]
name         = "identus-uniffi-did-spike"
version      = "0.0.0"
edition      = "2024"
rust-version = "1.98.1"
license      = "Apache-2.0"
publish      = false

[workspace]

[lib]
crate-type = [ "cdylib", "rlib" ]

[features]
bindgen-cli = [ "uniffi/cli" ]

[dependencies]
identus-did = { path = "../../../crates/did" }
uniffi      = { version = "=0.32.0", default-features = false }

[[bin]]
name              = "uniffi-bindgen"
path              = "src/bin/uniffi-bindgen.rs"
required-features = [ "bindgen-cli" ]

[lints.rust]
unsafe_code = "forbid"
warnings    = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
