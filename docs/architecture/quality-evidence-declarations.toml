  "invariant=DID and DID URL lexical grammar, native and serde boundaries, and byte limits agree",
  "domain=all ASCII bytes in each grammar position plus exact configured byte boundaries",
  "cases=deterministic exhaustive loops and explicit boundary fixtures",
]

