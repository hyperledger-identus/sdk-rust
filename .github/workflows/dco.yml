name: DCO

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  DCO:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3c9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: DCO check
        uses: christophebedard/dco@0f271d0b28c6b8a4f7c4a49c4c7f6c2db186c02d # v0.4
        with:
          args: --verbose