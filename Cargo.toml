[workspace]
resolver = "3"
members  = [ "crates/*" ]

[workspace.dependencies]
identus-adapters-entropy   = { path = "crates/adapters-entropy" }
identus-core               = { path = "crates/core" }
identus-crypto             = { path = "crates/crypto" }
identus-derive             = { path = "crates/derive" }
identus-did                = { path = "crates/did" }
identus-trust              = { path = "crates/trust" }
identus-credentials        = { path = "crates/credentials" }
identus-presentations      = { path = "crates/presentations" }
identus-jose               = { path = "crates/jose" }
identus-messaging          = { path = "crates/messaging" }
identus-openid4vc          = { path = "crates/openid4vc" }
identus-wallet             = { path = "crates/wallet" }
identus-agent              = { path = "crates/agent" }
identus-bindings           = { path = "crates/bindings" }
identus-conformance        = { path = "crates/conformance" }
identus-wallet-conformance = { path = "crates/wallet-conformance" }
proc-macro2                = "1"
quote                      = "1"
getrandom                  = "0.2"
serde                      = "1"
serde_json                 = "1"
coset                      = { version = "0.4", default-features = false }
syn                        = { version = "2", features = [ "full" ] }
toml                       = "0.8"
trybuild                   = "1"
uriparse                   = "=0.6.4"

# identus-crypto external dependencies (declared at workspace level per
# `workspace-dependency-conventions`). The `ring`-backed entropy adapter
# previously lived in `identus-adapters-entropy` but has been replaced by the
# `getrandom`-backed adapter (see the `add-getrandom-entropy-adapter`
# change); `ring` is no longer a workspace dependency.
ed25519-dalek = { version = "2", default-features = false, features = [ "fast", "zeroize" ] }
k256          = { version = "0.13", default-features = false, features = [ "arithmetic", "ecdsa" ] }
p256          = { version = "0.13", default-features = false, features = [ "arithmetic", "ecdsa" ] }
x25519-dalek  = { version = "2", features = [ "static_secrets" ] }
sha2          = "0.10"
hmac          = "0.12"
pbkdf2        = { version = "0.12", default-features = false, features = [ "simple" ] }
base64        = "0.22"
hex           = "0.4"
zeroize       = { version = "1.9", default-features = false, features = [ "alloc", "derive" ] }

[workspace.package]
edition      = "2024"
rust-version = "1.85.0"
version      = "0.0.0"
license      = "Apache-2.0"
publish      = false

[workspace.metadata.crane]
name = "identus-core"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
