  "fuzz/fuzz_targets/did.rs#fuzz_target!",
  "fuzz/fuzz_targets/did_url.rs#fuzz_target!",
  "scripts/fuzz-did.sh#-max_len=8192",
  ".github/workflows/did-fuzz.yml#Run bounded nightly soak",
]
command = "nix develop .#fuzz --command ./scripts/fuzz-did.sh soak all"
lane = "slow"
cadence = "weekly-or-manual"
targets = [ "package:identus-did", "host:linux", "sanitizer:address" ]
freshness = "max-age-days"
freshness_days = 8
budget = "Run each DID and DID URL fuzz target for 300 seconds with max_len=8192, timeout=5, and rss_limit_mb=1024."
receipt_kind = "github-run"
