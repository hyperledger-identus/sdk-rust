[workspace]
resolver = "3"

[package]
name = "identus-oauth2-oid4vci-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[dependencies]
oauth2 = { version = "=5.0.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
