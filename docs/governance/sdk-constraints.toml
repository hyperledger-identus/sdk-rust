[[entries]]
id               = "SDK-LIM-007"
kind             = "limitation"
category         = "security"
state            = "effective"
summary          = "Outer preallocation and native JSON rejection cleanup, caller-budgeted work, and one known unbounded compatibility placeholder remain outside typed SDK resource enforcement."
scope            = "Owned/serde/transport/FFI/JavaScript allocation before typed validation, recursive cleanup of hostile-depth owned DID JSON rejected by native constructors, borrowed cryptographic primitive work, injected async or generic storage adapter QoS, and identus_did::Multihash opaque-byte retention."
canonical_source = "docs/architecture/sdk-input-resource-boundaries.toml"
authority        = "Completed issue #168 repository-wide audit and accepted ADR 0125."
rationale        = "A typed SDK constructor cannot retroactively prevent outer allocation or always make recursive destruction of an already-owned rejected JSON tree stack-safe, generic non-retaining primitives and ports need protocol- or adapter-specific budgets, and bounding the historical infallible Multihash placeholder requires an explicit public API migration."
consumer_impact  = "Consumers must apply limits at their earliest owned boundary, use bounded DID slice parsers or pre-bound native JSON depth, budget delegated work, and never expose the unbounded Multihash compatibility placeholder directly to hostile input."
enforcement      = [ "machine-readable implemented-package input-boundary inventory", "offline inventory checker and mutation suite", "new/change boundary review", "typed boundary negative tests", "architecture and security review" ]
owner            = "SDK maintainers and security reviewers"
review_triggers  = [ "new or changed input family", "concrete transport or adapter moves into SDK", "consumer handles hostile input directly", "inventory gap found" ]
activation       = "Effective with the issue #168 inventory and ADR 0125; the earlier incomplete-audit wording is retired while the Multihash exception remains explicit."
rollback         = "Restore broad incomplete-audit disclosure immediately if a supposedly covered inherited surface lacks an honest disposition or evidence."

[[entries]]
id               = "SDK-LIM-008"
kind             = "limitation"
category         = "security"
state            = "effective"
summary          = "External and nested procedural-macro output is not uniformly inspected for unsafe Rust."
scope            = "Unsafe Rust emitted into an SDK crate by an external procedural macro, or created after the first-party direct-output check by a nested macro expansion whose span allows internal unsafe."
canonical_source = "docs/adr/0088-reject-unsafe-first-party-macro-output.md"
authority        = "Rust 1.98.1 compiler source, the Rust Reference unsafe-attribute inventory and issue #189 research."
rationale        = "Rustc intentionally skips unsafe_code when an expansion span allows internal unsafe. identus-derive now rejects enumerated unsafe constructs in completed direct item syntax, but it cannot execute or inspect later nested/external expansion."
consumer_impact  = "Consumers may rely on machine enforcement for authored first-party SDK source and guarded direct identus-derive output; external and nested expansion safety still requires dependency/macro review."
enforcement      = [ "workspace unsafe_code forbid for authored source", "proc-macro implementation target probe", "identus-derive direct-output syntax visitor", "semantic and dependency review" ]
owner            = "SDK maintainers and security reviewers"
review_triggers  = [ "procedural macro added or changed", "Rust macro-span behavior changes", "Rust unsafe lint or attribute inventory changes" ]
activation       = "Narrowed to external and nested expansion output through ADR 0088 after issue #189 machine evidence passes and merges."
rollback         = "Restore the broader procedural-macro limitation if the direct-output visitor is removed, becomes incomplete for the pinned Rust inventory or changes supported macro behavior."
