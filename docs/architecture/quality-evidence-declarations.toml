disposition = "satisfied"
risk = "Grammar drift, boundary disagreement, or inconsistent serialization may accept invalid identifiers or reject portable ones."
selectors = [
  "crates/did/tests/did_syntax.rs#generic_did_ascii_grammar_is_exhaustive",
  "crates/did/tests/did_syntax.rs#did_url_ascii_component_grammar_is_exhaustive",
  "crates/did/tests/did_syntax.rs#serde_and_native_boundaries_are_equivalent",
  "crates/did/tests/did_syntax.rs#exact_byte_limits_are_enforced",
]
command = "cargo test -p identus-did --test did_syntax"
lane = "focused"
cadence = "on-change"
targets = [ "package:identus-did", "host:rust" ]
freshness = "source-bound"
freshness_days = 0
budget = "Exhaust ASCII bytes 0..127 in each grammar position and verify exact 2,048-byte DID and 4,096-byte DID URL limits."
