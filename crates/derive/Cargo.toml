[package]
name                   = "identus-derive"
version                = "0.1.0-rc.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish                = [ "crates-io" ]
description            = "Derive macros for validated Hyperledger Identus Rust SDK domain types."
repository             = "https://github.com/hyperledger-identus/sdk-rust"
homepage               = "https://hyperledger-identus.github.io/sdk-rust/"
documentation          = "https://docs.rs/identus-derive/0.1.0-rc.1"
readme                 = "README.md"
keywords               = [ "identity", "ssi", "derive" ]
categories             = [ "development-tools::procedural-macro-helpers" ]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace       = true
syn.workspace         = true

[dev-dependencies]
serde.workspace      = true
serde_json.workspace = true
trybuild.workspace   = true

[lints]
workspace = true
