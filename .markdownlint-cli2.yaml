# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2

# Ignore patterns
ignores:
  - "**/target/**"
  - "**/node_modules/**"
  - ".claude/**"
  # Agent tooling scaffolding (pi prompts, agent skills) — not repo documentation
  - ".pi/**"
  - ".agents/**"
  # OpenSpec-managed change artifacts use OpenSpec's own format (e.g. files
  # begin with `## Why` / `## Context`), which conflicts with MD041.
  - "openspec/**"
