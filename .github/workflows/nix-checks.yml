name: slow

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto-coverage:
    name: crypto line coverage
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Measure first-party crypto line coverage
        run: nix develop -c ./scripts/coverage-crypto.sh artifacts/crypto-coverage

      - name: Publish coverage summary
        run: cat artifacts/crypto-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-coverage-${{ github.sha }}
          path: artifacts/crypto-coverage
          if-no-files-found: error
          retention-days: 30

  crypto-baseline:
    name: crypto performance baseline
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Measure representative crypto operations
        run: nix develop -c ./scripts/benchmark-crypto.sh --samples 20 --output artifacts/crypto-baseline.json

      - name: Upload measurement artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-baseline-${{ github.sha }}
          path: artifacts/crypto-baseline.json
          if-no-files-found: error
          retention-days: 30

  checks:
    name: slow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The hosted Ubuntu image has substantially less free space than the
      # full feature/target matrix needs. These SDKs are not used by this
      # Rust/Nix job; reclaim them before populating the Nix store.
      - name: Reclaim Linux runner disk for the full matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          df -h /

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run `nix flake check`
        run: nix flake check

      - name: Verify native DID host bindings and generator supply chain
        if: runner.os == 'macOS'
        run: |
          nix develop .#bindings --command cargo deny \
            --manifest-path tools/uniffi-bindgen/Cargo.toml --locked check
          nix develop .#bindings --command cargo audit \
            --file tools/uniffi-bindgen/Cargo.lock --deny warnings
          nix develop .#bindings --command ./scripts/check-uniffi-did-host.sh
