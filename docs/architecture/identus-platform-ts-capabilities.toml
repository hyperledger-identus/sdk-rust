  "normative-candidate",
  "identus-contract-candidate",
  "consumer-regression-candidate",
  "implementation-regression",
  "exploratory",
]
compatibility_risks = [ "low", "medium", "high", "critical" ]
rust_states = [
  "mature",
  "substantial",
  "partial",
  "placeholder",
  "absent",
  "outside-core",
]

