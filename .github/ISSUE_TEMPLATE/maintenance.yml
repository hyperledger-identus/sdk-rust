name: Maintenance
description: Improve repository harness, CI, automation, labels, docs hygiene, or release workflow.
title: "[Maintenance]: "
labels:
  - status:triage
  - type:maintenance
body:
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - manager
        - maintenance
        - conformance
        - docs
        - release
        - security
        - engineer
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: Capability
      options:
        - maintenance
        - conformance
        - bindings
        - adapters
        - did
        - credential
        - presentation
        - didcomm
        - openid4vc
        - wallet
        - agent
        - trust
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repository, automation, or process drift should be fixed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Concrete harness, CI, docs, or label-sync outcome.
    validations:
      required: true
  - type: textarea
    id: conformance
    attributes:
      label: Conformance Impact
      description: Fixture family, transcript, static-model, interop, infrastructure, or none.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Docs Impact
      description: Architecture, testing, migration, release, or none.
    validations:
      required: true
  - type: input
    id: discussion
    attributes:
      label: Discussion Link
      description: Link the GitHub Discussion if design debate is required, otherwise write N/A.
      placeholder: N/A
    validations:
      required: true
