[workspace]
resolver = "3"

[package]
name         = "identus-aries-askar-storage-spike"
version      = "0.0.0"
edition      = "2024"
rust-version = "1.98.1"
license      = "Apache-2.0"
publish      = false

[dependencies]
aries-askar    = { version = "=0.4.6", default-features = false, features = [ "sqlite" ] }
identus-wallet = { path = "../../../crates/wallet" }

[dev-dependencies]
identus-wallet-conformance = { path = "../../../crates/wallet-conformance" }

[lints.rust]
unsafe_code = "forbid"
warnings    = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
