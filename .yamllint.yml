---
extends: default

rules:
  # Allow long lines (common in CI workflows and docker-compose)
  line-length: disable

  # Allow truthy values like 'on' (used in GitHub Actions triggers)
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on"]

  # Relaxed comment indentation
  comments-indentation: disable

  # Don't require document start marker
  document-start: disable

  # Relaxed bracket/brace spacing
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Allow 1 space before comment
  comments:
    min-spaces-from-content: 1

  # Allow extra spaces after colon (common in aligned config)
  colons:
    max-spaces-after: 2

  # Relax indentation to allow 2-space variants
  indentation:
    spaces: consistent
    indent-sequences: whatever

  # Allow blank lines at end of file
  empty-lines:
    max-end: 1

ignore: |
  target/
  node_modules/
  .claude/
  .pi/
  openspec/
