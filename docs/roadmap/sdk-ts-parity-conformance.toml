non_claims = [ "browser WASM reuse", "current native binding support", "publication" ]

[[success_criterion]]
id = "SC-01"
title = "Capability-oriented TypeScript contract"
pass_condition = "New public exports, package paths, and primary documentation use capability or standards names and contain none of the closed legacy-public-name vocabulary."
evidence = [ "public API and package-export snapshot", "case-insensitive legacy-name guard", "migration-only exception inventory" ]
applicability = "all new Rust-backed TypeScript public surfaces"
not_applicable_policy = "No exemption for new public names; donor-history and private legacy providers are outside the public scan."
non_claims = [ "identical Rust and TypeScript API shapes", "removal of private legacy providers" ]

[[success_criterion]]
id = "SC-02"
title = "Target-specific build and runtime proof"
pass_condition = "Every claimed target has delivered build, artifact, loader, package, consumer E2E, resource, budget, and rollback evidence for its pinned runtime matrix."
evidence = [ "target record", "exact artifact identity", "consumer fixture", "accepted target budget", "rollback rehearsal" ]
applicability = "each applicable target of a delivered capability"
not_applicable_policy = "Requires owner, rationale, review or expiry trigger, and reconsideration rule in the capability record."
non_claims = [ "cross-target inference", "support from compile-only evidence" ]

[[success_criterion]]
id = "SC-03"
title = "Applicable SDK-TS E2E reuse"
pass_condition = "Every discovered donor E2E test is ledgered and each shared journey runs one TypeScript assertion body against legacy and Rust-backed private providers on every applicable target."
evidence = [ "donor revision path suite test ID and content hash", "discovered-count equality", "disposition and authority", "no unledgered skip focus or quarantine" ]
applicability = "all SDK-TS E2E tests discovered from the pinned donor revision"
not_applicable_policy = "Only adapted, platform-owned, superseded, or excluded with owner, rationale, replacement evidence, and reconsideration trigger."
non_claims = [ "all donor behavior is normative", "unchanged execution for superseded profiles" ]

[[success_criterion]]
id = "SC-04"
title = "Rust evidence for additions and deviations"
pass_condition = "Additional or intentionally different portable behavior has Rust-owned normative, negative, resource-bound, and E2E or conformance evidence plus applicable quality-evidence dispositions."
evidence = [ "rust-addition or rust-deviation ledger", "selected profile", "negative and boundary tests", "TypeScript boundary smoke" ]
applicability = "every Rust addition or deviation from the donor journey"
not_applicable_policy = "Requires a stable quality-evidence declaration or owner, rationale, review trigger, and reconsideration rule per evidence class."
non_claims = [ "TypeScript regressions define Rust semantics", "coverage alone establishes authority" ]

[[success_criterion]]
id = "SC-05"
title = "Coverage and public-operation exercise"
pass_condition = "Every owned public operation maps to contract or E2E evidence; owned changed executable code reaches at least 80 percent line and 70 percent branch coverage where reliable and never regresses below a higher established package baseline."
evidence = [ "public-operation inventory", "pinned tool version", "base head numerator denominator target and profile", "coverage artifact", "condition mutation and negative evidence where branch coverage is unavailable" ]
applicability = "owned changed executable Rust and TypeScript adapter code"
not_applicable_policy = "Unsupported measures require an owner, tool limitation, strongest alternative evidence, and reconsideration trigger; invented percentages are forbidden."
non_claims = [ "coverage proves conformance", "lowering an established higher baseline" ]

[[success_criterion]]
id = "SC-06"
title = "Type-safe and validated boundary"
pass_condition = "Pinned strict TypeScript declarations expose no explicit any, narrow unknown at ingress, validate wire values, and map numbers, bigint, bytes, null, undefined, errors, lifecycle, Promises, cancellation, and AbortSignal deterministically while Rust revalidates domain invariants."
evidence = [ "strict compiler receipt", "public declaration snapshot", "runtime wire-validation tests", "DTO error and API drift snapshots", "lifecycle and cancellation tests" ]
applicability = "all owned TypeScript binding and facade surfaces"
not_applicable_policy = "Platform-owned values still require strict host types and a bounded mapping rationale."
non_claims = [ "unknown is forbidden at ingress", "TypeScript validation replaces Rust validation" ]

[[success_criterion]]
id = "SC-07"
title = "Shared portable semantics and thin adapters"
pass_condition = "Portable core crates contain no inward binding or platform dependency; bindings depend inward only and TypeScript duplicates no cryptography, canonical parsing, format, or protocol-state logic."
evidence = [ "dependency-direction guard", "semantic-duplication review", "generated mapping drift test", "host-port contract tests" ]
applicability = "all Rust-backed capabilities"
not_applicable_policy = "Generated outer allocation bounds and explicit host policy are permitted when Rust remains authoritative."
non_claims = [ "one universal artifact", "platform-owned behavior moves to Rust" ]

[[success_criterion]]
id = "SC-08"
title = "Operable target with accepted budgets"
pass_condition = "Before support, each target has accepted size, startup, latency, throughput, and memory budgets as applicable plus bounded diagnostics, observability, fallback, and rollback."
evidence = [ "pinned runner and protocol", "compressed and uncompressed artifact size", "cold and warm p50 p95", "representative latency throughput and memory", "variance regression and rollback rules" ]
applicability = "each target support claim"
not_applicable_policy = "A measure may be omitted only with owner, rationale, review or expiry trigger, and reconsideration rule; until a budget is accepted results remain measurement-only."
non_claims = [ "universal performance threshold", "measurement activates support" ]

[[success_criterion]]
id = "SC-09"
title = "Rust-core-first isolated CI"
pass_condition = "The independent Rust-core job passes first, a fail-closed exact-head impact plan selects all dependent target jobs, selected jobs do not cancel siblings, and the existing protected fast aggregator fails only for selected failures."
evidence = [ "core package-set guard", "API and schema fingerprints", "impact-plan receipt", "isolated target receipts", "single fast aggregation receipt" ]
applicability = "every pull request after CI implementation"
not_applicable_policy = "Unselected targets emit an inapplicable receipt without installing target tools; unknown impact selects all targets."
non_claims = [ "changing SDK-LIM-009", "a target failure erases core evidence", "path-only impact routing" ]

