- name: status:triage
  color: "ededed"
  description: New work that needs classification and ownership.
- name: status:needs-spec
  color: "d4c5f9"
  description: Work needs specification, acceptance criteria, or design evidence.
- name: status:ready
  color: "c2e0c6"
  description: Work is ready for an agent to implement.
- name: status:in-progress
  color: "bfdadc"
  description: An agent is actively working on this item.
- name: status:blocked
  color: "e11d21"
  description: Progress is blocked by a decision, dependency, or external state.
- name: status:review
  color: "fbca04"
  description: Pull request is ready for code review.
- name: status:security-review
  color: "b60205"
  description: Security-sensitive change requires security review.
- name: status:docs-review
  color: "1d76db"
  description: Documentation review is required.
- name: status:conformance
  color: "5319e7"
  description: Conformance fixtures, parity, or protocol gates must pass.
- name: status:ready-to-merge
  color: "0e8a16"
  description: Required reviews and gates are complete.
- name: status:released
  color: "0052cc"
  description: Change has shipped in release notes and tags.
- name: type:capability
  color: "0e8a16"
