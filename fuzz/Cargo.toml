[package]
name    = "identus-sdk-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base64                = "=0.22.1"
hex                   = "=0.4.3"
identus-crypto        = { path = "../crates/crypto", default-features = false, features = [ "cose", "jwk-thumbprint" ] }
identus-did           = { path = "../crates/did" }
identus-did-peer      = { path = "../crates/did-peer" }
identus-prism-did     = { path = "../crates/prism-did" }
identus-prism-indexer = { path = "../crates/prism-indexer" }
identus-prism-vdr     = { path = "../crates/prism-vdr" }
identus-jose          = { path = "../crates/jose" }
identus-oid4vp        = { path = "../crates/oid4vp" }
libfuzzer-sys         = "=0.4.13"
serde                 = "=1.0.228"
serde_json            = "=1.0.150"

[[bin]]
name  = "did"
path  = "fuzz_targets/did.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "did_url"
path  = "fuzz_targets/did_url.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "peer_did"
path  = "fuzz_targets/peer_did.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "prism_operation"
path  = "fuzz_targets/prism_operation.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "prism_did"
path  = "fuzz_targets/prism_did.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "prism_vdr"
path  = "fuzz_targets/prism_vdr.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "prism_indexer_batch"
path  = "fuzz_targets/prism_indexer_batch.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "jws_compact"
path  = "fuzz_targets/jws_compact.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "public_jwk"
path  = "fuzz_targets/public_jwk.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "public_cose"
path  = "fuzz_targets/public_cose.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "direct_post_response"
path  = "fuzz_targets/direct_post_response.rs"
test  = false
doc   = false
bench = false

