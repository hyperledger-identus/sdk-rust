[workspace]
resolver = "3"

[package]
name         = "identus-siros-dcql-spike"
version      = "0.0.0"
edition      = "2024"
rust-version = "1.98.1"
license      = "Apache-2.0"
publish      = false

[dependencies]
serde_json = "=1.0.151"
