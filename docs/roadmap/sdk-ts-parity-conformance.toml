schema_version   = 2
milestone_id     = "TS1"
milestone_number = 7
milestone_url    = "https://github.com/hyperledger-identus/sdk-rust/milestone/7"
title            = "SDK-Rust/SDK-TS capability parity and conformance"
program_issue    = 502
definition_issue = 594
status           = "baseline"
snapshot_date    = "2026-11-07"

[source]
inventory = "docs/architecture/identus-platform-ts-capabilities.toml"
repository = "https://github.com/hyperledger-identus/sdk-ts"
revision = "4bf86ebf69d5e96616a148e4c973f831f95fa38e"
package = "@hyperledger/identus-sdk"
version = "8.1.4"

[delivery]
mode = "local-first-capability-trains"
target_changed_loc_min = 5000
target_changed_loc_max = 10000
target_is_merge_gate = false
excluded_loc = [ "generated", "vendored", "lockfiles", "evidence-artifacts" ]
required_contents = [ "implementation", "adapters", "vectors", "migration", "documentation", "tests" ]
split_conditions = [ "independent-ownership", "security-or-release-authority", "independent-rollback", "unsafe-review-size" ]
checkpoint_policy = "signed-reviewable-commits-with-targeted-local-gates"
candidate_policy = "complete-applicable-local-gate-before-push"
hosted_ci_policy = "mandatory-final-confirmation"

[vocabulary]
relations = [ "semantic-equivalent", "compatible-adapter", "platform-owned", "intentionally-different", "deferred", "retired" ]
states = [ "delivered", "partial", "blocked", "excluded", "not-applicable" ]
dimensions = [ "normative-profile", "rust-contract", "adapter-mapping", "shared-vectors", "error-behavior", "resource-security", "target-runtime", "consumer-proof", "rollback" ]
targets = [ "browser", "nodejs", "react-web", "react-native" ]
target_states = [ "delivered", "partial", "blocked", "excluded", "not-applicable" ]
legacy_public_names = [ "apollo", "castor", "mercury", "pluto", "pollux", "edge-agent" ]
donor_test_dispositions = [ "shared", "adapted", "platform-owned", "superseded", "excluded" ]
rust_evidence_dispositions = [ "rust-addition", "rust-deviation" ]

[ci]
core_job = "core-rust"
protected_status = "fast"
policy_constraint = "SDK-LIM-009"
impact_job = "binding-impact-plan"
target_jobs = [ "target-browser", "target-nodejs", "target-react-web", "target-react-native", "target-package-types" ]
impact_inputs = [ "exported-api-fingerprint", "binding-schema-fingerprint", "transitive-bound-crates", "relevant-lockfiles", "generated-mappings", "package-metadata", "target-contracts", "changed-paths" ]
unknown_impact = "select-all-target-jobs"
selected_failure = "preserve-core-result-and-fail-fast-aggregator"
unselected_target = "machine-readable-inapplicable-receipt-without-target-toolchain"
fail_fast = false
dependency_direction = "bindings-and-platform-adapters-depend-inward-on-portable-core-only"

[[target]]
id = "browser"
state = "target"
runtime_matrix = [ "real Chromium", "real Firefox", "supported browser versions remain unselected" ]
binding = "wasm-bindgen WASM over portable Rust crates"
artifact = "browser ESM WASM package"
module_format = "ESM"
loader = "browser package export with bundler and direct-module fixtures"
host_ports = [ "fetch", "storage", "time", "entropy", "custody", "lifecycle" ]
consumer_fixture = "plain browser and client React application"
support_tier = "target-not-supported"
ci_job = "target-browser"
success_evidence = [ "wasm build", "package import", "real-browser E2E", "bundle budget", "rollback" ]
limitations = [ "SDK-LIM-002", "SDK-LIM-003" ]
non_claims = [ "current runtime certification", "publication", "default route" ]

[[target]]
id = "nodejs"
state = "target"
runtime_matrix = [ "supported Node.js versions remain unselected", "ESM and CommonJS consumers" ]
binding = "Node-compatible WASM over portable Rust crates"
artifact = "Node.js WASM package entry"
module_format = "ESM and CommonJS compatibility entries"
loader = "Node package exports with worker, filesystem, and WebCrypto policy"
host_ports = [ "fetch", "filesystem", "storage", "time", "entropy", "custody", "workers", "lifecycle" ]
consumer_fixture = "plain Node.js application"
support_tier = "target-not-supported"
ci_job = "target-nodejs"
success_evidence = [ "wasm build", "package import", "Node E2E", "module-format matrix", "rollback" ]
limitations = [ "SDK-LIM-002" ]
non_claims = [ "browser ESM equivalence", "current runtime certification", "publication" ]

[[target]]
