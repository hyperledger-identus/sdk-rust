outer_obligation = "The protocol caller owns message bytes and CPU budget; primitives do not retain the message."
consumer_impact  = "Apply protocol-specific byte/work limits before invoking linear cryptographic work."
review_triggers  = [ "primitive starts retaining messages", "superlinear primitive work", "protocol-specific facade added" ]

