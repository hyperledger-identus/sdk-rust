[[changes]]
id                                = "did.syntax.long-form-resource-policy.v1"
capability                        = "did.syntax"
lifecycle_state                   = "active"
issue                             = 524
pull_request                      = 527
change_class                      = "behavioral"
release_note_class                = "changed"
visibility                        = [ "behavior", "public-api" ]
affected_packages                 = [ "identus-did", "identus-uniffi-did", "identus-wasm-did" ]
affected_consumers                = [ "sdk-rust-adopters" ]
source_version                    = "0.1.0-rc.1"
target_version                    = "unreleased"
compatibility                     = "compatible"
old_behavior                      = "Generic DID values reject bare identifiers above 2048 bytes and DID URLs or absolute URIs above 4096 bytes; an oversized normalized cache key may fail closed."
new_behavior                      = "Generic DID and URI values admit the measured finite long-form envelope while the independent method and cache limits remain bounded; a valid oversized cache identity bypasses retention observably."
migration_action                  = "Use the exported constants rather than copied literals, handle KeyBudgetBypass as an uncached successful resolution path, and keep external transport limits explicit."
replacement                       = "The same identus-did DID, DID URL, URI, and resolver APIs with larger literal lexical ceilings and an additional redaction-safe cache status."
no_replacement_rationale          = ""
first_compatible_version          = "unreleased"
last_compatible_version           = "0.1.0-rc.1"
compatibility_window              = "The release-candidate line documents the new limits before a stable 0.1.0 contract is declared."
deprecation_phase                 = "not-applicable"
legacy_bug_policy                 = "fix-and-document"
mapping_disposition               = "required"
mapping_ids                       = [ "did-url.value.typescript.legacy-v1", "did.error.invalid-did-url.typescript.legacy-v1", "did.error.invalid-did.typescript.legacy-v1", "did.value.typescript.legacy-v1" ]
mapping_rationale                 = ""
vector_ids                        = [ "did-url.syntax.max-bytes", "did-url.syntax.over-max-bytes", "did.syntax.max-bytes", "did.syntax.over-max-bytes" ]
quality_declaration_ids           = [ "did.syntax.quality.v1" ]
observability                     = "Record stable result and KeyBudgetBypass classes without recording the DID, options, or normalized cache key."
fallback                          = "Bypass cache retention for valid oversized identities; do not truncate keys or fall back to a second parser."
rollback                          = "Restore the prior lexical constants and cache outcome before publication while retaining issue and measurement evidence."
rollback_restores_unsafe_behavior = false
removal_gate                      = "Not applicable; this is an expansion of a bounded public envelope rather than a deprecated facade."
evidence_selectors                = [ "docs/architecture/language-adapter-mappings.toml#did.value.typescript.legacy-v1", "docs/conformance/cross-language-vector-catalog.toml#did.syntax.max-bytes" ]
evidence_artifacts                = [ "docs/adr/0175-bound-generic-did-for-prism-long-form-state.md", "docs/architecture/sdk-input-resource-boundaries.toml" ]
limitations                       = "The lexical envelope does not guarantee transportability through every host, cache retention, or acceptance by a method-specific semantic profile."
active                            = true
