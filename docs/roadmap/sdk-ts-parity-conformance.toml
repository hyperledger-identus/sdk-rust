module_format = "consumer-bundler ESM"
loader = "React provider or hook integration without domain-logic duplication"
host_ports = [ "browser ports", "React lifecycle", "SSR boundary" ]
consumer_fixture = "client and SSR/hydration React applications"
support_tier = "target-not-supported"
ci_job = "target-react-web"
success_evidence = [ "client E2E", "bundler matrix", "SSR boundary E2E", "hydration proof", "rollback" ]
limitations = [ "SDK-LIM-002", "SDK-LIM-003" ]
non_claims = [ "a second Rust artifact", "React Native support", "current runtime certification" ]

[[target]]
id = "react-native"
state = "blocked"
