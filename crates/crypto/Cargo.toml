[package]
name                   = "identus-crypto"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[dependencies]
identus-core.workspace   = true
identus-derive.workspace = true

# Feature-gated external crypto primitives (declared at workspace level per
# `workspace-dependency-conventions`). `ring` is intentionally absent —
# entropy adapters live in `identus-adapters-entropy` (now `getrandom`-backed).
ed25519-dalek = { workspace = true, optional = true }
ed25519-bip32 = { workspace = true, optional = true }
bip39         = { workspace = true, optional = true }
k256          = { workspace = true, optional = true }
p256          = { workspace = true, optional = true }
x25519-dalek  = { workspace = true, optional = true }
sha2          = { workspace = true, optional = true }
hmac          = { workspace = true, optional = true }
pbkdf2        = { workspace = true, optional = true }
base64        = { workspace = true, optional = true }
hex           = { workspace = true, optional = true }
serde         = { workspace = true, optional = true, features = [ "derive" ] }
serde_json    = { workspace = true, optional = true }
coset         = { workspace = true, optional = true }
zeroize       = { workspace = true, optional = true }

[features]
default = [
  "ed25519",
  "x25519",
  "secp256k1",
  "secp256r1",
  "hash",
  "hex",
  "base64",
  "jwk",
  "jwk-thumbprint",
  "cose",
  "derivation",
  "cardano-bip32",
]

# Opt-in KMP (`apollo`) interop escape hatch for legacy PRISM wallet import.
# Compatibility adapters remain separate from standards-correct BIP-39 and the
# reusable Cardano V2 primitive exposed by `cardano-bip32`.
kmp-compat = [ "derivation", "dep:pbkdf2" ]

# `SecureRandom` is the only infrastructure port and is zero-dependency, so it
# is always available (no `securerandom` feature).
ed25519        = [ "jwk", "dep:ed25519-dalek", "dep:zeroize" ]
x25519         = [ "jwk", "dep:x25519-dalek", "dep:zeroize" ]
secp256k1      = [ "jwk", "dep:k256", "dep:zeroize" ]
secp256r1      = [ "jwk", "dep:p256", "dep:zeroize" ]
hash           = [ "dep:sha2" ]
hex            = [ "dep:hex" ]
base64         = [ "dep:base64" ]
jwk            = [ "base64", "dep:serde", "dep:serde_json" ]
jwk-thumbprint = [ "jwk", "hash" ]
cose           = [ "dep:coset" ]
derivation     = [ "hash", "dep:bip39", "dep:hmac", "dep:zeroize", "secp256k1", "ed25519" ]
cardano-bip32  = [ "dep:ed25519-bip32", "dep:zeroize" ]

[dev-dependencies]
hex      = { workspace = true }
k256     = { workspace = true }
trybuild = { workspace = true }

[[example]]
name = "crypto_baseline"
path = "examples/crypto_baseline.rs"
required-features = [
  "hash",
  "ed25519",
  "x25519",
  "secp256k1",
  "secp256r1",
  "derivation",
  "cardano-bip32",
  "jwk",
]

[[test]]
name              = "cose"
path              = "tests/cose.rs"
required-features = [ "cose" ]

[[test]]
name              = "curves"
path              = "tests/curves.rs"
required-features = [ "ed25519", "secp256k1", "secp256r1", "x25519" ]

[[test]]
name              = "derivation"
path              = "tests/derivation.rs"
required-features = [ "derivation", "x25519" ]

[[test]]
name              = "cardano_bip32"
path              = "tests/cardano_bip32.rs"
required-features = [ "cardano-bip32" ]

[[test]]
name              = "jwk"
path              = "tests/jwk.rs"
required-features = [ "jwk-thumbprint" ]

[[test]]
name              = "hash"
path              = "tests/hash.rs"
required-features = [ "hash" ]

[[test]]
name              = "secp256k1_compat"
path              = "tests/secp256k1_compat.rs"
required-features = [ "hex", "secp256k1" ]

[lints]
workspace = true
