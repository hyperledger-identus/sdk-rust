[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
version = "0.0.0"
license = "Apache-2.0"

[workspace.metadata.crane]
name = "identus-ssi"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }