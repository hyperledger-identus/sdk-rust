[[boundaries]]
id               = "core-fixed-values"
package          = "identus-core"
surface          = "static capability/error metadata, finite enums, timestamps, durations and clock ports"
disposition      = "fixed-or-no-input"
limits           = [  ]
evidence         = [ "docs/architecture/identus-core-input-boundaries.md", "crates/core/src/time.rs" ]
outer_obligation = "Numeric wire token scanning belongs to the selected deserializer before typed u64 construction."
consumer_impact  = "No retained dynamic input exists beyond fixed integers and static references."
review_triggers  = [ "new core public type", "new core serde surface", "new dynamic core field" ]

[[boundaries]]
id               = "core-url"
package          = "identus-core"
surface          = "Url borrowed/owned construction and string serde"
disposition      = "sdk-enforced"
limits           = [ "MAX_URL_BYTES=8192" ]
evidence         = [ "docs/architecture/identus-core-input-boundaries.md", "crates/core/src/url.rs" ]
outer_obligation = "Owned String and serde allocation can occur before Url validation."
consumer_impact  = "Bound transport bytes before allocation; typed Url retention is capped at 8192 UTF-8 bytes."
review_triggers  = [ "URL parser change", "URL limit change", "new URL wire adapter" ]

[[boundaries]]
id               = "derive-compile-time-input"
package          = "identus-derive"
surface          = "validated-newtype and port procedural-macro token streams"
disposition      = "fixed-or-no-input"
limits           = [  ]
evidence         = [ "crates/derive/src/lib.rs", "docs/adr/0088-reject-unsafe-first-party-macro-output.md" ]
outer_obligation = "Rust compiler procedural-macro resource governance is build-time tooling, not runtime untrusted input."
consumer_impact  = "Generated runtime constructors inherit bounds from their owning type."
review_triggers  = [ "new derive macro", "runtime parser generated by macro", "macro input source changes" ]

[[boundaries]]
id               = "crypto-fixed-key-material"
package          = "identus-crypto"
surface          = "digests, curve keys, signatures, JWK coordinates and COSE key structures"
disposition      = "sdk-enforced"
limits           = [ "MAX_CRYPTO_TEXT_BYTES=4096", "MAX_COSE_KEY_BYTES=4096", "MAX_COSE_ADDITIONAL_PARAMETERS=32", "MAX_COSE_NESTING_DEPTH=16", "MAX_JWK_EXTENSIONS=32", "MAX_JWK_EXTENSION_DEPTH=16", "MAX_JWK_EXTENSION_NODES=1024", "MAX_JWK_EXTENSION_TEXT_BYTES=65536" ]
evidence         = [ "crates/crypto/src/hash.rs", "crates/crypto/src/jwk.rs", "crates/crypto/src/cose.rs" ]
outer_obligation = "JWK serde may allocate raw strings/maps before validated construction."
consumer_impact  = "Typed key material is fixed-size or bounded; callers still bound enclosing JSON before serde."
review_triggers  = [ "new key representation", "new COSE/JWK member", "new serde entry point" ]

[[boundaries]]
id               = "crypto-codecs-and-derivation"
package          = "identus-crypto"
surface          = "hex/base64url parsing and BIP32/SLIP-0010/Cardano derivation paths and seeds"
disposition      = "sdk-enforced"
limits           = [ "MAX_CRYPTO_TEXT_BYTES=4096", "MAX_DERIVATION_PATH_BYTES=4096", "MAX_DERIVATION_PATH_AXES=255", "MAX_HD_SEED_BYTES=64", "MIN_HD_SEED_BYTES=16" ]
evidence         = [ "crates/crypto/src/hex.rs", "crates/crypto/src/base64.rs", "crates/crypto/src/derivation/mod.rs", "crates/crypto/src/derivation/path.rs" ]
outer_obligation = "Programmatic DerivationPath growth is caller-owned, while every cryptographic path consumer rejects more than 255 axes before child work."
consumer_impact  = "Untrusted text and seeds fail before decoding/derivation beyond the declared limits."
review_triggers  = [ "new codec", "new derivation family", "path or seed limit change" ]

[[boundaries]]
id               = "crypto-bip39"
package          = "identus-crypto"
surface          = "BIP-39 entropy conversion, English mnemonic validation and standard/KMP passphrases"
disposition      = "sdk-enforced"
limits           = [ "MAX_BIP39_WORDS=24", "MAX_BIP39_ENGLISH_WORD_BYTES=8", "MAX_BIP39_PASSPHRASE_BYTES=4096", "MAX_BIP39_ENTROPY_BYTES=32" ]
