[package]
name    = "identus-sdk-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base64                = "=0.22.1"
hex                   = "=0.4.3"
identus-crypto        = { path = "../crates/crypto", default-features = false, features = [ "cose", "ed25519", "jwk-thumbprint", "secp256r1" ] }
identus-core          = { path = "../crates/core" }
identus-credentials   = { path = "../crates/credentials" }
identus-did           = { path = "../crates/did" }
identus-did-key       = { path = "../crates/did-key" }
identus-did-jwk       = { path = "../crates/did-jwk" }
identus-did-web       = { path = "../crates/did-web" }
identus-did-peer      = { path = "../crates/did-peer" }
identus-prism-did     = { path = "../crates/prism-did" }
identus-prism-indexer = { path = "../crates/prism-indexer" }
identus-prism-vdr     = { path = "../crates/prism-vdr" }
identus-jose          = { path = "../crates/jose" }
identus-oid4vp        = { path = "../crates/oid4vp" }
identus-siopv2        = { path = "../crates/siopv2" }
identus-sd-jwt        = { path = "../crates/sd-jwt" }
identus-sd-jwt-vc     = { path = "../crates/sd-jwt-vc" }
libfuzzer-sys         = "=0.4.13"
serde                 = "=1.0.228"
serde_json            = "=1.0.150"

[[bin]]
name  = "sd_jwt"
path  = "fuzz_targets/sd_jwt.rs"
