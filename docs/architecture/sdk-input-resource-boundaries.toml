outer_obligation = "The caller owns allocations for the input word vector, its Strings and passphrase before invocation."
consumer_impact  = "The helper rejects impossible or oversized inputs before join, normalization, dependency parsing or PBKDF2."
review_triggers  = [ "BIP-39 language change", "passphrase limit change", "mnemonic dependency change" ]

[[boundaries]]
id               = "crypto-borrowed-primitives"
package          = "identus-crypto"
surface          = "hash, HMAC, sign, verify and shared-secret operations over borrowed messages"
