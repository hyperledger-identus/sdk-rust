name: fast

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Record immutable target plan
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci/target-plan.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --profile production-ready \
            --output "$RUNNER_TEMP/target-plan.json"
          sed -n '/"areas"/,/]/p; /"slowRecommended"/,/]/p' \
            "$RUNNER_TEMP/target-plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Run fast factory and Rust gates
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.factory-contract \
            .#checks.x86_64-linux.lint-nix \
            .#checks.x86_64-linux.lint-text \
            .#checks.x86_64-linux.lint-toml \
            .#checks.x86_64-linux.rust-fmt \
            .#checks.x86_64-linux.rust-build \
            .#checks.x86_64-linux.rust-clippy \
            .#checks.x86_64-linux.rust-test
