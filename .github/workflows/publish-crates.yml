name: publish crates
run-name: publish crates / ${{ inputs.release_tag }} / ${{ inputs.authentication }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed immutable release tag
        required: true
        type: string
      expected_sha:
        description: Exact full protected-develop source revision
        required: true
        type: string
      authentication:
        description: Explicit crates.io authentication class
        required: true
        type: choice
        options:
          - bootstrap-token
          - trusted-publishing

concurrency:
  group: crates-io-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Verify signed tag identity through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$RELEASE_TAG" = "crypto-v0.1.0-rc.1"
          printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          test "$(jq -r '.object.type' <<<"$ref_json")" = "tag"
          tag_object=$(jq -r '.object.sha' <<<"$ref_json")
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          test "$(jq -r '.verification.verified' <<<"$tag_json")" = "true"
          test "$(jq -r '.object.type' <<<"$tag_json")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$EXPECTED_SHA"

      - name: Verify protected environment policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/crates-io")
          test "$(jq -r '.can_admins_bypass' <<<"$environment")" = "false"
          test "$(jq -r '.deployment_branch_policy.protected_branches' <<<"$environment")" = "true"
          test "$(jq -r '.deployment_branch_policy.custom_branch_policies' <<<"$environment")" = "false"
          jq -e '.protection_rules[] | select(
            .type == "required_reviewers" and
            .prevent_self_review == true and
            any(.reviewers[]; .type == "Team" and .reviewer.slug == "identus-maintainers")
          )' <<<"$environment" >/dev/null

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout to protected develop
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$EXPECTED_SHA"
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/develop

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Rebuild exact deterministic candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: >-
          nix run .#crypto-candidate --
          --output artifacts/crypto-candidate
          --source-revision "$EXPECTED_SHA"

      - name: Verify publication workspace and receipt
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          AUTHENTICATION: ${{ inputs.authentication }}
        run: >-
          nix develop --command python3 scripts/publish-release-train.py
          --evidence artifacts/crypto-candidate
          --expected-sha "$EXPECTED_SHA"
          --release-tag "$RELEASE_TAG"
          --auth-class "$AUTHENTICATION"
          --receipt-output artifacts/release-verification.json

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crates-io-candidate-${{ inputs.expected_sha }}-${{ github.run_attempt }}
          path: |
            artifacts/crypto-candidate
            artifacts/release-verification.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish protected crate train
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download same-run candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crates-io-candidate-${{ inputs.expected_sha }}-${{ github.run_attempt }}
          path: artifacts

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Authenticate with crates.io trusted publishing
        if: inputs.authentication == 'trusted-publishing'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish bootstrap train
        if: inputs.authentication == 'bootstrap-token'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_PUBLISH }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          nix develop --command python3 scripts/publish-release-train.py
          --evidence artifacts/crypto-candidate
          --expected-sha "$EXPECTED_SHA"
          --release-tag "$RELEASE_TAG"
          --auth-class bootstrap-token
          --receipt-output artifacts/publication-receipt.json
          --publish

      - name: Publish trusted train
        if: inputs.authentication == 'trusted-publishing'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          nix develop --command python3 scripts/publish-release-train.py
          --evidence artifacts/crypto-candidate
          --expected-sha "$EXPECTED_SHA"
          --release-tag "$RELEASE_TAG"
          --auth-class trusted-publishing
          --receipt-output artifacts/publication-receipt.json
          --publish

      - name: Attest published crate archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/crypto-candidate/packages/*.crate

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "SDK-Rust crypto train 0.1.0-rc.1" \
            --notes-file docs/release/0.1.0-rc.1.md \
            artifacts/crypto-candidate/packages/*.crate \
            artifacts/crypto-candidate/*.cdx.json \
            artifacts/crypto-candidate/receipt.json \
            artifacts/publication-receipt.json

      - name: Upload publication receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crates-io-publication-${{ inputs.expected_sha }}-${{ github.run_attempt }}
          path: artifacts/publication-receipt.json
          if-no-files-found: warn
          retention-days: 400
