  "standard-or-security",
  "identus-profile",
  "maintained-rust-upstream",
  "identus-contract-or-consumer",
  "cross-sdk-interoperability",
  "donor-precedent",
]
decision_adr = 169

[vocabulary]
dispositions = [
  "move-to-rust",
  "retain-platform",
  "replace-upstream",
  "defer",
  "deprecate",
  "drop",
]
