[workspace]
resolver = "3"
members  = [ "crates/*" ]

[workspace.dependencies]
identus-adapters-entropy   = { path = "crates/adapters-entropy" }
identus-core               = { path = "crates/core" }
identus-crypto             = { path = "crates/crypto", default-features = false }
identus-derive             = { path = "crates/derive" }
identus-did                = { path = "crates/did" }
identus-did-resolver-http  = { path = "crates/did-resolver-http" }
identus-trust              = { path = "crates/trust" }
identus-credentials        = { path = "crates/credentials" }
identus-presentations      = { path = "crates/presentations" }
identus-jose               = { path = "crates/jose" }
identus-messaging          = { path = "crates/messaging" }
identus-openid4vc          = { path = "crates/openid4vc" }
identus-oid4vci            = { path = "crates/oid4vci" }
identus-wallet             = { path = "crates/wallet" }
identus-agent              = { path = "crates/agent" }
identus-bindings           = { path = "crates/bindings" }
identus-conformance        = { path = "crates/conformance" }
identus-wallet-conformance = { path = "crates/wallet-conformance" }
identus-uniffi-did         = { path = "crates/uniffi-did" }
identus-wasm-did           = { path = "crates/wasm-did" }
proc-macro2                = "1"
quote                      = "1"
getrandom                  = "0.2"
fluent-uri                 = { version = "=0.4.1", default-features = false }
serde                      = "1"
serde_json                 = "1"
coset                      = { version = "0.4", default-features = false }
syn                        = { version = "2", features = [ "full", "visit" ] }
toml                       = "0.8"
trybuild                   = "1"
uriparse                   = "=0.6.4"
uniffi                     = { version = "=0.32.0", default-features = false }
wasm-bindgen               = "=0.2.121"

# identus-did-resolver-http external dependencies. Axum is deliberately built
# without listener/runtime defaults; Tokio and Tower `util` are test-only.
axum           = { version = "=0.8.9", default-features = false, features = [ "json" ] }
headers-accept = "=0.3.0"
mediatype      = "=0.21.0"
tokio          = "1"
tower          = "0.5"
utoipa         = { version = "=5.5.0", default-features = false, features = [ "macros" ] }

# identus-crypto external dependencies (declared at workspace level per
# `workspace-dependency-conventions`). The `ring`-backed entropy adapter
# previously lived in `identus-adapters-entropy` but has been replaced by the
# `getrandom`-backed adapter (see the `add-getrandom-entropy-adapter`
# change); `ring` is no longer a workspace dependency.
ed25519-dalek = { version = "2", default-features = false, features = [ "fast", "zeroize" ] }
ed25519-bip32 = { version = "=0.4.3", default-features = false }
bip39         = { version = "=2.2.2", default-features = false, features = [ "alloc", "zeroize" ] }
k256          = { version = "0.13", default-features = false, features = [ "arithmetic", "ecdsa" ] }
p256          = { version = "0.13", default-features = false, features = [ "arithmetic", "ecdsa" ] }
x25519-dalek  = { version = "2", features = [ "static_secrets" ] }
sha2          = "0.10"
hmac          = "0.12"
pbkdf2        = { version = "0.12", default-features = false, features = [ "simple" ] }
base64        = "0.22"
bs58          = { version = "=0.5.1", default-features = false, features = [ "alloc" ] }
hex           = "0.4"
zeroize       = { version = "1.9", default-features = false, features = [ "alloc", "derive" ] }

[workspace.package]
edition      = "2024"
rust-version = "1.98.1"
version      = "0.0.0"
license      = "Apache-2.0"
publish      = false

[workspace.metadata.crane]
name = "identus-core"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings    = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
