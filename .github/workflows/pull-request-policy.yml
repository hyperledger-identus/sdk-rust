name: Pull Request Policy

on:
  pull_request_target:
    branches:
      - develop
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pull-request-policy-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: pull-request-policy
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # SECURITY: this privileged event must execute only the exact base tree.
      # Pull-request content enters the job solely as untrusted data/objects.
      - name: Check out exact protected-base policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Bind exact base and head object identities
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            printf 'pull-request-policy: event contains an invalid base, head, or pull-request identity\n' >&2
            exit 1
          fi
          actual_base=$(git rev-parse --verify 'HEAD^{commit}')
          if [[ "$actual_base" != "$PR_BASE_SHA" ]]; then
            printf 'pull-request-policy: checkout %s is not exact base %s\n' "$actual_base" "$PR_BASE_SHA" >&2
            exit 1
          fi
          git fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/$PR_NUMBER/head:refs/sdk-rust-policy/pull-head"
          actual_head=$(git rev-parse --verify 'refs/sdk-rust-policy/pull-head^{commit}')
          if [[ "$actual_head" != "$HEAD_SHA" ]]; then
            printf 'pull-request-policy: fetched head %s is not exact event head %s\n' "$actual_head" "$HEAD_SHA" >&2
            exit 1
          fi

      - name: Validate pull request delivery policy
        id: policy
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: scripts/check-pr-policy.sh

      - name: Verify corresponding issue exists
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.policy.outputs.issue-number }}
        run: |
          issue_url=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          expected_url="https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
          if [[ "$issue_url" != "$expected_url" ]]; then
            printf 'pull-request-policy: #%s is not a repository issue\n' "$ISSUE_NUMBER" >&2
            exit 1
          fi

      - name: Validate contribution metadata
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci/contribution-policy.mjs pr

      - name: Reject contribution policy relaxation
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/contribution-policy.mjs policy-monotonicity

      - name: Validate exact hosted commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            | jq -s '[.[][] | {
                sha: .sha,
                message: .commit.message,
                authorName: .commit.author.name,
                authorEmail: .commit.author.email,
                committerName: .commit.committer.name,
                committerEmail: .commit.committer.email,
                committerActor: (.committer.login // ""),
                parentShas: [.parents[].sha],
                treeSha: .commit.tree.sha,
                verification: .commit.verification,
                actor: (.author.login // "")
              }]' > "$RUNNER_TEMP/pull-commits.json"
          COMMITS_FILE="$RUNNER_TEMP/pull-commits.json" \
            node scripts/ci/contribution-policy.mjs hosted-commits
