# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# The `advisories` check is handled by the `rust-audit` flake check
# (crane `cargoAudit` with a pinned advisory-db); `cargoDeny` runs the
# `bans`, `licenses`, and `sources` checks by default.

[graph]
all-features = false

[advisories]
ignore = [  ]

[licenses]
# Allow common permissive licenses; anything else is denied.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[[licenses.exceptions]]
# libFuzzer's runtime carries the OSI-approved NCSA license in addition to its
# MIT/Apache wrapper. This exception is restricted to the fuzz-only binding.
allow = [ "NCSA" ]
crate = "libfuzzer-sys@0.4.13"

[bans]
# Start permissive: warn on duplicate versions, allow wildcards.
multiple-versions          = "warn"
wildcards                  = "allow"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"

[sources]
unknown-registry = "warn"
unknown-git      = "warn"
allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]
allow-git        = [  ]
