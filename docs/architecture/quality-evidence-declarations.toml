owner_issue = 501
debt_status = "none"
debt_issue = 0
rationale = ""
details = [
  "harness=libFuzzer DID and DID URL parse/round-trip targets",
  "corpus=fuzz/corpus/did and fuzz/corpus/did_url",
  "seed=libFuzzer-managed reproducible failing inputs",
  "bounds=max_len=8192;timeout=5;rss_limit_mb=1024;max_total_time=300",
