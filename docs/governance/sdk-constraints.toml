[[entries]]
id               = "SDK-SEC-001"
kind             = "hard"
category         = "security"
state            = "prohibited"
summary          = "Unsafe Rust is prohibited by default."
scope            = "All SDK source unless a dedicated safety ADR explicitly grants a bounded exception."
canonical_source = "CONTRIBUTING.md#development-rules"
authority        = "Repository security and contribution policy."
rationale        = "Identity and cryptographic code needs auditable memory-safety boundaries."
consumer_impact  = "Consumers receive compiler and conformance evidence that supported first-party SDK targets reject unauthorized unsafe Rust."
enforcement      = [ "workspace unsafe_code forbid", "member-inheritance conformance guard", "target-class compile-fail probes", "first-party direct macro-output syntax guard", "semantic and source review" ]
owner            = "SDK maintainers and security reviewers"
review_triggers  = [ "unsafe block proposed", "procedural macro added or changed", "Rust unsafe syntax inventory changes", "native dependency introduced" ]
activation       = "The policy and authored-target enforcement are effective through ADR 0087; direct identus-derive item-output enforcement is effective through ADR 0088. Any exception requires a new issue, dedicated safety ADR, indexed scope/invariants and specialist review."
rollback         = "Remove the unsafe code or revoke the bounded exception."

[[entries]]
id               = "SDK-SEC-002"
kind             = "hard"
category         = "security"
state            = "prohibited"
summary          = "Raw secret material cannot cross diagnostics, serialization or FFI surfaces."
